# nginx для mxbt-AutoScoring. Плейсхолдеры __DOMAIN__ и __WEBHOOK_PATH__ подставляет deploy/install.sh.
# Наружу открыто только то, что нужно MAX и эквайеру; бот и mock-сервисы слушают 127.0.0.1.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Проверка Let's Encrypt (certbot --webroot) и продление сертификата
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    # fullchain.pem содержит промежуточные сертификаты — MAX требует полную цепочку
    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:mxbt_ssl:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;   # MAX ждёт ответ не дольше 30 с; бот отвечает сразу

    # События MAX (секрет X-Max-Bot-Api-Secret проверяет бот)
    location = __WEBHOOK_PATH__ {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:3000;
    }

    # Уведомления эквайера об оплате (подпись проверяет бот)
    location = /payments/webhook {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:3000;
    }

    # Проверка живости — для мониторинга
    location = /health {
        proxy_pass http://127.0.0.1:3000;
    }

    # Тестовая страница оплаты mock-эквайера. Убрать, когда подключите настоящего эквайера.
    location ^~ /pay/ {
        proxy_pass http://127.0.0.1:4000;
    }

    location / {
        return 404;
    }
}
